<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1" />
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#22d3ee" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer HUD Ring & Ticks -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="#22d3ee" stroke-width="4" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="140" fill="url(#coreGlow)" opacity="0.35" />

  <!-- Tactical Reticle Ticks -->
  <line x1="256" y1="40" x2="256" y2="80" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="432" x2="256" y2="472" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
  <line x1="40" y1="256" x2="80" y2="256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />
  <line x1="432" y1="256" x2="472" y2="256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" />

  <!-- Corner Brackets (HUD Reticle) -->
  <path d="M 170 140 L 140 140 L 140 170" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 342 140 L 372 140 L 372 170" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 140 342 L 140 372 L 170 372" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 372 342 L 372 372 L 342 372" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central Arc Core / Microchip & Solder Tip -->
  <rect x="206" y="206" width="100" height="100" rx="16" fill="#0b1329" stroke="#22d3ee" stroke-width="4" />
  <!-- Circuit Traces -->
  <path d="M 206 230 L 176 230 M 206 256 L 166 256 M 206 282 L 176 282" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <path d="M 306 230 L 336 230 M 306 256 L 346 256 M 306 282 L 336 282" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <path d="M 230 206 L 230 176 M 256 206 L 256 166 M 282 206 L 282 176" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
  <path d="M 230 306 L 230 336 M 256 306 L 256 346 M 282 306 L 282 336" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />

  <!-- Glowing Core Symbol (Soldering Iron & Lightning) -->
  <polygon points="256,220 270,250 252,250 264,285 242,255 260,255" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="256" cy="256" r="6" fill="#ffffff" />
</svg>
